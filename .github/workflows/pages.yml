name: Test and publish briefing
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm run build
      - run: npm test
      - name: Confirm committed page matches sources
        run: git diff --exit-code -- index.html
      - name: Stage self-contained page
        run: mkdir _site && cp index.html _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
